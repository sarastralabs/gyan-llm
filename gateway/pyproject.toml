[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gyan-gateway"
version = "0.1.0"
description = "OpenAI-compatible API gateway for a local Ollama model: API keys, rate limits, queue, usage."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.4,<3",
  "redis>=5.0,<7",
  "trafilatura>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "fakeredis>=2.26",
  "ruff>=0.6",
]

[project.scripts]
gyan-gateway = "gyan_gateway.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# FastAPI's dependency injection is written as `x = Depends(...)` in signatures.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Test data (HTML, JSON, URLs) reads better on one line.
"tests/*" = ["E501"]
